{# Ícones em SVG inline (traçado no estilo Lucide). Emoji nunca é ícone de interface. #}
{% macro ico(nome, tamanho=16) -%}
<svg class="ico" width="{{ tamanho }}" height="{{ tamanho }}" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if nome == 'lista' -%}
  <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
{%- elif nome == 'relogio' -%}
  <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif nome == 'bloqueio' -%}
  <rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
{%- elif nome == 'duvida' -%}
  <circle cx="12" cy="12" r="9"/><path d="M9.2 9.3a3 3 0 0 1 5.6 1.2c0 2-2.8 2.5-2.8 4"/><path d="M12 17h.01"/>
{%- elif nome == 'engrenagem' -%}
  <circle cx="12" cy="12" r="3"/>
  <path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>
{%- elif nome == 'checklist' -%}
  <path d="M9 11l2 2 4-4"/><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4"/>
{%- elif nome == 'alerta' -%}

{%- elif nome == 'ok' -%}
  <circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/>
{%- elif nome == 'info' -%}
  <circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/>
{%- elif nome == 'sair' -%}
  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>
{%- elif nome == 'cadeado' -%}
  <rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 15v2"/>
{%- elif nome == 'robo' -%}
  <rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4M9 4h6"/><path d="M9 13h.01M15 13h.01"/><path d="M9.5 16.5h5"/>
{%- elif nome == 'seta-esq' -%}
  <path d="M19 12H5M11 18l-6-6 6-6"/>
{%- elif nome == 'dinheiro' -%}
  <path d="M12 2v20"/><path d="M17 6.5A3.5 3.5 0 0 0 13.5 4h-2a3.5 3.5 0 0 0 0 7h1a3.5 3.5 0 0 1 0 7h-2A3.5 3.5 0 0 1 7 17.5"/>
{%- elif nome == 'predio' -%}
  <rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M9 8h.01M15 8h.01M9 12h.01M15 12h.01M10 21v-4h4v4"/>
{%- elif nome == 'sino' -%}
  <path d="M18 8a6 6 0 1 0-12 0c0 6-3 7-3 7h18s-3-1-3-7"/><path d="M10.3 20a2 2 0 0 0 3.4 0"/>
{%- elif nome == 'funil' -%}
  <path d="M3 4h18l-7 8v7l-4 2v-9z"/>
{%- elif nome == 'inbox' -%}
  <path d="M3 12h5l2 3h4l2-3h5"/><path d="M5.5 5h13l2.5 7v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-6z"/>
