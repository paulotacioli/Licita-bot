# Filtros de descoberta e triagem. Editável pelo painel em Configurações.
#
# Duas camadas:
#   1. `perfil`: o que a empresa busca e evita, em linguagem natural. Com `pre_triagem_ia: true`, a IA lê o
#      objeto de cada edital novo (em lote, modelo barato) e descarta o que não combina, ANTES de baixar PDF.
#      O mesmo texto orienta a triagem completa, que lê o edital.
#   2. Cortes baratos e estruturais (modalidade, UF, prazo, valor, palavras negativas). As palavras positivas
#      só são obrigatórias quando a pré-triagem por IA está desligada.

perfil:
  pre_triagem_ia: true
  lote_pre_triagem: 40        # objetos por chamada à IA
  maximo_por_rodada: 400      # limite por execução; o resto fica para a próxima
  buscamos: >
    Contratação de desenvolvimento de software sob demanda (fábrica de software, sistemas web e mobile,
    pontos de função, horas de desenvolvimento), sustentação e manutenção evolutiva de sistemas existentes,
    integração de sistemas e APIs, e licenciamento de sistema como serviço (SaaS) com hospedagem, em que
    possamos entregar solução própria. Trabalho remoto, com equipe própria.
  evitamos: >
    Compra de equipamentos ou hardware, licenças de fabricante específico (Microsoft, Oracle, Adobe,
    antivírus), outsourcing de postos de trabalho ou alocação de mão de obra presencial, exigência de
    equipe residente no órgão, obras, telefonia, links de internet, impressão, e objetos em que o software
    é só acessório de um equipamento.


termos_busca:
  - software
  - "desenvolvimento de sistema"
  - "fábrica de software"
  - "sistema web"
  - "sistema informatizado"
  - "solução tecnológica"
  - "licenciamento de software"
  - "licença de uso de software"
  - SaaS
  - "plataforma digital"
  - aplicativo
  - "portal web"
  - "sustentação de sistemas"
  - "manutenção de sistemas"
  - "pontos de função"

# O objeto precisa conter pelo menos UMA destas palavras (a busca do PNCP é difusa e traz muito ruído)
palavras_positivas:
  - software
  - sistema
  - sistemas
  - aplicativo
  - aplicação web
  - plataforma digital
  - plataforma de
  - portal web
  - portal da transparência
  - portal eletrônico
  - licenciamento
  - licença de uso
  - saas
  - desenvolvimento de sistema
  - desenvolvimento de software
  - desenvolvimento de solução
  - desenvolvimento de aplicativo
  - desenvolvimento e manutenção
  - desenvolvimento, manutenção
  - fábrica de software
  - informatizad
  - tecnologia da informação
  - solução tecnológica
  - solução de tic
  - erp

# Se o objeto contiver estas palavras, descarta sem chamar a IA
palavras_negativas:
  - "aquisição de computadores"
  - "notebooks"
  - "impressoras"
  - "toner"
  - "cabeamento"
  - "hardware"
  - "servidores físicos"
  - "câmeras"
  - "videomonitoramento"
  - "workstation"
  - "macbook"
  - "all in one"
  - "desktop"
  - "rádio"
  - "veículos"
  - "médico-hospitalar"
  - "medicamentos"
  - "gêneros alimentícios"

modalidades_aceitas: [6, 4, 8, 12]   # Pregão Eletrônico, Concorrência Eletrônica, Dispensa, Credenciamento
ufs: []                              # vazio = Brasil inteiro; ex.: ["SP", "RJ", "MG"]
esferas: []                          # vazio = todas; ex.: ["Federal"]
prazo_minimo_dias: 3                 # mínimo de dias até o encerramento das propostas
score_minimo: 60
score_zona_cinzenta: 40
categorias_aceitas: [desenvolvimento, licenciamento_saas, manutencao]
max_paginas_por_termo: 50            # 50 x 100 = até 5.000 resultados por termo
