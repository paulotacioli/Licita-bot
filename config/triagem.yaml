# Filtros de descoberta e triagem. Editável pelo painel em Configurações.
#
# Duas camadas:
#   1. `perfil`: o que a empresa busca e evita, em linguagem natural. Com `pre_triagem_ia: true`, a IA lê o
#      objeto de cada edital novo (em lote, modelo barato) e descarta o que não combina, ANTES de baixar PDF.
#      O mesmo texto orienta a triagem completa, que lê o edital.
#   2. Cortes baratos e estruturais (modalidade, UF, prazo, valor, palavras negativas). As palavras positivas
#      só são obrigatórias quando a pré-triagem por IA está desligada.

perfil:
  pre_triagem_ia: true
  lote_pre_triagem: 40        # objetos por chamada à IA
  maximo_por_rodada: 400      # limite por execução; o resto fica para a próxima
  buscamos: >
    Só software 100% online: sistema acessado pelo navegador, hospedado em nuvem pelo fornecedor
    (SaaS, "software como serviço", "solução em nuvem", "web", "plataforma online"), sem instalação
    nas máquinas ou nos servidores do órgão e sem equipe presencial.

    PRIORIDADE MÁXIMA, mesmo que o edital não diga a palavra "software": captura, digitalização,
    processamento, validação, guarda e armazenamento em nuvem de documentos fiscais eletrônicos —
    NF-e, NFS-e, CT-e, CT-e OS, MDF-e, NFC-e, manifesto eletrônico, DF-e, XML e DANFE — incluindo
    monitoramento de eventos na SEFAZ, manifestação do destinatário, conciliação fiscal e guarda
    pelo prazo legal. Também são prioridade gestão eletrônica de documentos (GED), digitalização e
    indexação de acervos com OCR, arquivo digital e repositório documental em nuvem, desde que a
    entrega seja o sistema online e não serviço de escaneamento no local.

    Também servem, com prioridade normal: desenvolvimento de software sob demanda entregue como
    aplicação web (fábrica de software, pontos de função), sustentação e manutenção evolutiva de
    sistemas web, integração de sistemas e APIs, e licenciamento de SaaS com hospedagem em que
    possamos entregar solução própria. Trabalho sempre remoto, com equipe própria.
  evitamos: >
    Software instalado no servidor ou nas máquinas do órgão (on-premise, licença perpétua instalada,
    sistema desktop, cliente-servidor), migração para datacenter do contratante e qualquer solução que
    exija infraestrutura física nossa no órgão.

    Serviço presencial de digitalização ou de organização de arquivo com equipe e scanners no local,
    fornecimento ou locação de scanners e equipamentos.

    Guarda física externa de documentos: armazenamento, custódia e arquivamento de papel, caixas-arquivo
    ou acervo em galpão do fornecedor, com transporte e consulta física — é serviço de armazém, não
    software, e não serve nem quando o edital cita digitalização junto. Só interessa se a entrega for o
    sistema online de guarda digital.

    Compra de equipamentos ou hardware, licenças de fabricante específico (Microsoft, Oracle, Adobe,
    antivírus), outsourcing de postos de trabalho ou alocação de mão de obra presencial, exigência de
    equipe residente no órgão, obras, telefonia, links de internet, impressão, e objetos em que o
    software é só acessório de um equipamento.


