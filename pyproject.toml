[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "licitabot"
version = "0.1.0"
description = "Automação de licitações públicas de software no Brasil (PNCP + Compras.gov.br)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "sqlmodel>=0.0.22",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "apscheduler>=3.10,<4",
    "playwright>=1.47",
    "anthropic>=0.40",
    "docxtpl>=0.18",
    "python-docx>=1.1",
    "pypdf>=5.0",
    "pdfplumber>=0.11",
    "itsdangerous>=2.2",
    "aiosmtplib>=3.0",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6"]
word = ["docx2pdf>=0.1.8", "pywin32>=306"]

[project.scripts]
licitabot = "licitabot.cli:app"

[tool.setuptools.packages.find]
include = ["licitabot*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
